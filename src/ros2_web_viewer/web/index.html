<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhenAIx · Chelsea Flower Show Digital Twin</title>
  <link rel="stylesheet" href="/assets/style.css" />

  <!-- Three.js ES module imports via importmap (vendored locally for offline use) -->
  <script type="importmap">
  {
    "imports": {
      "three":         "/assets/vendor/three/three.module.js",
      "three/addons/": "/assets/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>

  <div id="app-layout">
    <div id="left-pane">
      <div id="viewer-square">
        <!-- ── Three.js canvas ─────────────────────────────── -->
        <canvas
          id="canvas"
          class="ros-viewer-canvas"
          data-ros-widget="3d"
          data-display="urdf pointcloud markers"
          data-pointcloud-topics="/points /integrated_cloud"
          data-marker-topics="/markers"
          data-camera-position="2.0 1.6 2.0"
          data-camera-look-at="0 0.5 0"
          data-controls-target="0 0.4 0"
          data-controls-enable-damping="true"
          data-controls-damping-factor="0.06"
          data-controls-min-distance="0.1"
          data-controls-max-distance="20"
          data-controls-auto-rotate="true"
          data-controls-auto-rotate-speed="0.75"></canvas>
      </div>
    </div>

    <div id="right-pane">
      <div id="html-panel" data-ros-widget="html-panel" data-topic="/viewer_panel_html">
        <div id="html-panel-header">
          <span>&#x25CF;&nbsp;DYNAMIC PANEL</span>
          <span id="html-topic-label" data-role="html-topic-label">—</span>
        </div>
        <div id="html-panel-content" data-role="html-content">Waiting for ROS HTML content…</div>
      </div>

      <div class="parameter-panel" style="margin-top: 10px; border: 1px solid rgba(224, 220, 169, 0.20); border-radius: 4px; overflow: hidden;">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 7px 12px; border-bottom: 1px solid rgba(224, 220, 169, 0.20); font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cream-dim);">
          <span>&#x25CF;&nbsp;PARAMETERS</span>
          <span>live sync</span>
        </div>
        <div style="padding: 10px 12px;">
          <p style="margin: 0 0 8px;">Fixed frame (text input, string):</p>
          <input
            type="text"
            data-ros-param-node="/ros2_web_viewer"
            data-ros-param-name="fixed_frame"
            data-ros-param-type="string"
            data-ros-param-default="base_link" />
          <p style="margin: 10px 0 8px;">Target frame (drop-down, string):</p>
          <select
            data-ros-param-node="/ros2_web_viewer"
            data-ros-param-name="target_frame"
            data-ros-param-type="string"
            data-ros-param-default="base_link">
            <option value="base_link">base_link</option>
            <option value="map">map</option>
            <option value="odom">odom</option>
          </select>
        </div>
      </div>

      <!-- ── Camera image panel ───────────────────────────── -->
      <div id="image-panel" class="hidden" data-ros-widget="image-panel" data-topic="/camera/image_raw">
        <div id="image-header">
          <span>&#x25CF;&nbsp;SENSOR FEED</span>
          <span id="image-topic-label" data-role="image-topic-label">—</span>
        </div>
        <img id="camera-image" alt="camera feed" style="display:none" />
        <div id="image-placeholder" data-role="image-placeholder">NO SIGNAL</div>
      </div>
    </div>
  </div>

  <!-- ── Aesthetic overlays ──────────────────────────── -->
  <div id="bg-wallpaper"></div>
  <div id="vignette"></div>

  <!-- Corner brackets -->
  <div class="corner" id="corner-tl"></div>
  <div class="corner" id="corner-tr"></div>
  <div class="corner" id="corner-bl"></div>
  <div class="corner" id="corner-br"></div>

  <!-- ── Top bar ─────────────────────────────────────── -->
  <div id="topbar">
    <div id="logo">Phen<span>AI</span>x</div>
    <div id="tagline">Chelsea Flower Show · Digital Twin</div>
    <div id="topbar-spacer"></div>
    <div id="ws-pill">
      <div id="ws-dot"></div>
      <span id="ws-label">OFFLINE</span>
    </div>
  </div>

  <!-- ── Loading screen ──────────────────────────────── -->
  <div id="loading">
    <div id="loading-title">Phen<span>AI</span>x</div>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    <div id="loading-sub">Initialising digital twin…</div>
  </div>

  <!-- ── Application ─────────────────────────────────── -->
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
