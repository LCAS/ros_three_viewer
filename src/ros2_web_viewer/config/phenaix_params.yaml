/**:
  ros__parameters:
    # ────────────────────────────────────────────────────────────────────────────
    # PhenAIx project-specific parameter overrides
    # ────────────────────────────────────────────────────────────────────────────
    # Base config is in config/params.yaml; overrides below are PhenAIx-specific.
    
    # Web server
    host: "0.0.0.0"
    port: 8080

    # ────────────────────────────────────────────────────────────────────────────
    # Topics — PhenAIx-specific sensor/integration pipeline topics
    # ────────────────────────────────────────────────────────────────────────────
    image_topics:
      - /camera/color/image_raw      # RealSense camera RGB image

    pointcloud_topics:
      - /integrated_cloud             # Integrated point cloud from fusion module

    marker_array_topics:
      # - /planning_markers           # Uncomment if using planning visualizations
      # - /detection_markers

    # ────────────────────────────────────────────────────────────────────────────
    # URDF & TF configuration
    # ────────────────────────────────────────────────────────────────────────────
    fixed_frame: "base_link"
    target_frame: "base_link"

    html_panel_topics:
      - /viewer_panel_html
    html_routes: "{'/modular': 'examples/modular.html'}"

    # ────────────────────────────────────────────────────────────────────────────
    # URDF link display filtering
    # ────────────────────────────────────────────────────────────────────────────
    urdf_link_whitelist: []         # Leave empty to show all links
    urdf_link_blacklist: []         # Or specify links to hide

    # ────────────────────────────────────────────────────────────────────────────
    # Performance & rendering
    # ────────────────────────────────────────────────────────────────────────────
    pointcloud_max_points: 8000     # Adjust based on network/GPU performance
    image_jpeg_quality: 65          # Balance quality/latency for your network
