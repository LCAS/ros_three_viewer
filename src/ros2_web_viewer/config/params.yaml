/**:
  ros__parameters:
    # ────────────────────────────────────────────────────────────────────────────
    # Web server
    # ────────────────────────────────────────────────────────────────────────────
    host: "0.0.0.0"               # Bind address for the HTTP/WebSocket server
    port: 8080                      # Port for the HTTP/WebSocket server

    # ────────────────────────────────────────────────────────────────────────────
    # URDF & TF configuration
    # ────────────────────────────────────────────────────────────────────────────
    fixed_frame: "base_link"        # TF frame used as world origin (RViz-style)
    target_frame: "base_link"       # Fallback TF frame (used if fixed_frame not set)

    html_routes: "{'/': 'index.html', '/modular': 'examples/modular.html'}"  # Route->html path mapping (paths are relative to web/)

    # ────────────────────────────────────────────────────────────────────────────
    # URDF link display filtering (whitelist has precedence over blacklist)
    # When whitelist is non-empty, ONLY those links are displayed.
    # When whitelist is empty and blacklist is non-empty, those links are hidden.
    # When both are empty, all links are displayed.
    # ────────────────────────────────────────────────────────────────────────────
    #urdf_link_whitelist: []         # List of URDF link names to display (priority over blacklist)
    #urdf_link_blacklist: []         # List of URDF link names to hide (ignored if whitelist non-empty)
    urdf_link_whitelist:
      - "shoulder_link"
      - "upper_arm_link"
      - "forearm_link"
      - "wrist_1_link"
      - "wrist_2_link"
      - "wrist_3_link"
    # urdf_link_blacklist:
    #   - "world"
    #   - "base_link"
    #   - "ft_frame"
    #   - "base"
    #   - "flange"
    #   - "tool0"

    # ────────────────────────────────────────────────────────────────────────────
    # Performance & rendering
    # ────────────────────────────────────────────────────────────────────────────
    pointcloud_max_points: 8000     # Maximum points per cloud (heavier clouds are downsampled)
    image_jpeg_quality: 65          # JPEG quality for compressed image bridge (1-100; lower = faster but blurrier)
