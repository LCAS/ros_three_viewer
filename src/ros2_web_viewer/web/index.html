<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhenAIx · Chelsea Flower Show Digital Twin</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js ES module imports via importmap -->
  <script type="importmap">
  {
    "imports": {
      "three":          "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/":  "https://unpkg.com/three@0.161.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="app-layout">
    <div id="left-pane">
      <div id="viewer-square">
        <!-- ── Three.js canvas ─────────────────────────────── -->
        <canvas id="canvas"></canvas>
      </div>
    </div>

    <div id="right-pane">
      <div id="html-panel">
        <div id="html-panel-header">
          <span>&#x25CF;&nbsp;DYNAMIC PANEL</span>
          <span id="html-topic-label">—</span>
        </div>
        <iframe id="html-content-frame" title="Dynamic panel content" sandbox></iframe>
      </div>

      <!-- ── Status panel ───────────────────────────────────── -->
      <div id="status-panel">
        <div id="status-header">System Status</div>
        <div class="status-row">
          <span class="status-label">ROBOT</span>
          <span class="status-value warn" id="st-robot">waiting…</span>
        </div>
        <div class="status-row">
          <span class="status-label">JOINTS</span>
          <span class="status-value" id="st-joints">—</span>
        </div>
        <div class="status-row">
          <span class="status-label">CLOUD</span>
          <span class="status-value" id="st-cloud">—</span>
        </div>
        <div class="status-row">
          <span class="status-label">MARKERS</span>
          <span class="status-value" id="st-markers">—</span>
        </div>
        <div class="status-row">
          <span class="status-label">IMAGE</span>
          <span class="status-value" id="st-image">—</span>
        </div>
        <div class="status-row">
          <span class="status-label">HTML</span>
          <span class="status-value" id="st-html">—</span>
        </div>
        <div class="status-row">
          <span class="status-label">FPS</span>
          <span class="status-value" id="st-fps">—</span>
        </div>
      </div>

      <!-- ── Camera image panel ───────────────────────────── -->
      <div id="image-panel" class="hidden">
        <div id="image-header">
          <span>&#x25CF;&nbsp;SENSOR FEED</span>
          <span id="image-topic-label">—</span>
        </div>
        <img id="camera-image" alt="camera feed" style="display:none" />
        <div id="image-placeholder">NO SIGNAL</div>
      </div>
    </div>
  </div>

  <!-- ── Aesthetic overlays ──────────────────────────── -->
  <div id="bg-wallpaper"></div>
  <div id="vignette"></div>

  <!-- Corner brackets -->
  <div class="corner" id="corner-tl"></div>
  <div class="corner" id="corner-tr"></div>
  <div class="corner" id="corner-bl"></div>
  <div class="corner" id="corner-br"></div>

  <!-- ── Top bar ─────────────────────────────────────── -->
  <div id="topbar">
    <div id="logo">Phen<span>AI</span>x</div>
    <div id="tagline">Chelsea Flower Show · Digital Twin</div>
    <div id="topbar-spacer"></div>
    <div id="ws-pill">
      <div id="ws-dot"></div>
      <span id="ws-label">OFFLINE</span>
    </div>
  </div>

  <!-- ── Loading screen ──────────────────────────────── -->
  <div id="loading">
    <div id="loading-title">Phen<span>AI</span>x</div>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    <div id="loading-sub">Initialising digital twin…</div>
  </div>

  <!-- ── Application ─────────────────────────────────── -->
  <script type="module" src="app.js"></script>
</body>
</html>
