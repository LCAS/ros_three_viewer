/**:
  ros__parameters:
    # ────────────────────────────────────────────────────────────────────────────
    # PhenAIx project-specific parameter overrides
    # ────────────────────────────────────────────────────────────────────────────
    # Base config is in config/params.yaml; overrides below are PhenAIx-specific.
    
    # Web server
    host: "0.0.0.0"
    port: 8080

    # ────────────────────────────────────────────────────────────────────────────
    # URDF & TF configuration
    # ────────────────────────────────────────────────────────────────────────────
    fixed_frame: "base_link"
    target_frame: "base_link"

    html_routes: "{'/': 'index.html', '/modular': 'examples/modular.html'}"

    # ────────────────────────────────────────────────────────────────────────────
    # URDF link display filtering
    # ────────────────────────────────────────────────────────────────────────────
    urdf_link_whitelist: []         # Leave empty to show all links
    urdf_link_blacklist: []         # Or specify links to hide

    # ────────────────────────────────────────────────────────────────────────────
    # Performance & rendering
    # ────────────────────────────────────────────────────────────────────────────
    pointcloud_max_points: 8000     # Adjust based on network/GPU performance
    image_jpeg_quality: 65          # Balance quality/latency for your network
