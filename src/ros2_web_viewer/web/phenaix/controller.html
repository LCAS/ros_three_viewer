<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhenAIx · Controller</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Controller-specific layout — portrait / iPad ────────── */
    #app-layout {
      align-items: stretch;
      justify-content: stretch;
    }

    #app-grid {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr auto;
      width: 100%;
      max-width: 100%;
      aspect-ratio: unset;
      height: 100%;
      padding: 12px;
      gap: 12px;
      box-sizing: border-box;
    }

    /* ── Info panel (top) ────────────────────────────────────── */
    .widget-html .html-content-inner {
      font-size: clamp(0.8rem, 2.5cqi, 1.15rem);
      overflow-y: auto;
    }

    /* ── Control panel (bottom) ──────────────────────────────── */
    .widget-controls {
      display: flex;
      flex-direction: column;
    }

    .controls-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 16px 16px;
      overflow: visible;
    }

    .ctrl-btn {
      width: 100%;
      min-height: clamp(64px, 10vh, 100px);
      padding: 0 24px;
      border: 2px solid rgba(74, 65, 51, 0.50);
      border-radius: 10px;
      background: rgba(224, 220, 169, 0.12);
      color: var(--cream);
      font-family: var(--font);
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .ctrl-btn svg {
      width: clamp(22px, 4vw, 32px);
      height: clamp(22px, 4vw, 32px);
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ctrl-btn:active:not(:disabled) {
      background: rgba(224, 220, 169, 0.28);
    }

    .ctrl-btn:disabled {
      opacity: 0.40;
      cursor: not-allowed;
    }

    .ctrl-btn[data-trigger-state="ok"]      { border-color: var(--good); }
    .ctrl-btn[data-trigger-state="error"]   { border-color: var(--danger); }
    .ctrl-btn[data-trigger-state="pending"] { border-color: var(--warn); }

    .ctrl-btn-scan   { border-color: rgba(74, 122, 58, 0.70); }
    .ctrl-btn-stop   { border-color: rgba(192, 101, 74, 0.70); }
    .ctrl-btn-print  { border-color: rgba(74,  65, 51, 0.60); }
    .ctrl-btn-restart { border-color: rgba(192, 101, 74, 0.85); }

    .ctrl-param-label {
      font-family: var(--font);
      font-size: clamp(0.8rem, 2.2vw, 1rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--cream-dim);
      margin-bottom: 4px;
    }

    .ctrl-param-select {
      width: 100%;
      min-height: clamp(46px, 7vh, 64px);
      border: 2px solid rgba(74, 65, 51, 0.50);
      border-radius: 10px;
      background: rgba(224, 220, 169, 0.16);
      color: var(--cream);
      font-family: var(--font);
      font-size: clamp(0.95rem, 3vw, 1.2rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0 16px;
    }
  </style>
</head>
<body>
  <div id="app-layout">
    <div id="app-grid">

      <!-- Top: Plant info panel (receives HTML from /html/controller topic) -->
      <div class="grid-cell widget-html" data-ros-widget="html-panel" data-topic="/html/controller">
        <div class="widget-header">
          <span>&#x25CF;&nbsp;PLANT INFO</span>
          <span data-role="html-topic-label">—</span>
        </div>
        <div data-role="html-content" class="html-content-inner">Waiting for plant data…</div>
      </div>

      <!-- Bottom: Controller buttons -->
      <div class="grid-cell widget-controls">
        <div class="widget-header">
          <span>&#x25CF;&nbsp;CONTROLS</span>
        </div>

        <div class="controls-content">

        <label class="ctrl-param-label" for="plant-profile-select">Plant profile</label>
        <select
          id="plant-profile-select"
          class="ctrl-param-select"
          data-ros-param-node="/morphological_traits_extractor_node"
          data-ros-param-name="plant_profile"
          data-ros-param-type="string"
          data-ros-param-default="plant_profile">
          <option value="plant_profile">Generic</option>
          <option value="tomato">Tomato</option>
          <option value="strawberry">Strawberry</option>
          <option value="eastern_african_lily">Eastern African Lily</option>
          <option value="japanese_aralia">Japanese Aralia</option>
          <option value="spanish_bayonet">Spanish Bayonet</option>
        </select>

        <label class="ctrl-param-label">Services</label>
        <button
          class="ctrl-btn ctrl-btn-scan"
          data-trigger-service="/start_capture"
          data-trigger-timeout="10"
          data-trigger-cooldown="1">
          <!-- Camera / scan icon -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          Scan
        </button>

        <button
          class="ctrl-btn ctrl-btn-stop"
          data-trigger-service="/cancel_capture"
          data-trigger-timeout="5"
          data-trigger-cooldown="1">
          <!-- Stop / square icon -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" fill="currentColor" stroke="none"/>
          </svg>
          Stop Scan
        </button>

        <label class="ctrl-param-label" for="dry-run-select">Printer dry run</label>
        <select
          id="dry-run-select"
          class="ctrl-param-select"
          data-ros-param-node="/printer_node"
          data-ros-param-name="dry_run"
          data-ros-param-type="boolean"
          data-ros-param-default="false">
          <option value="false">Off (print normally)</option>
          <option value="true">On (skip printing)</option>
        </select>

        <button
          class="ctrl-btn ctrl-btn-print"
          data-trigger-service="/print"
          data-trigger-timeout="10"
          data-trigger-cooldown="1">
          <!-- Printer icon -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="6 9 6 2 18 2 18 9"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="8"/>
          </svg>
          Print
        </button>

        <button
          class="ctrl-btn ctrl-btn-restart"
          data-trigger-service="/restart_system"
          data-trigger-confirm="Restart the system now?"
          data-trigger-timeout="2"
          data-trigger-cooldown="3">
          <!-- Restart icon -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15A9 9 0 1 1 23 10"/>
          </svg>
          Restart
        </button>

        </div><!-- /.controls-content -->

      </div><!-- /.widget-controls -->

    </div><!-- /#app-grid -->
  </div><!-- /#app-layout -->

  <div id="bg-wallpaper"></div>
  <div id="vignette"></div>
  <div id="topbar">
    <div id="logo">PhenAIx</div>
    <div id="tagline">Controller</div>
    <div id="topbar-spacer"></div>
    <div id="ws-pill">
      <div id="ws-dot"></div>
      <span id="ws-label">OFFLINE</span>
    </div>
  </div>

  <div id="corner-tl" class="corner"></div>
  <div id="corner-tr" class="corner"></div>
  <div id="corner-bl" class="corner"></div>
  <div id="corner-br" class="corner"></div>

  <script type="importmap">
  {
    "imports": {
      "three":         "/assets/vendor/three/three.module.js",
      "three/addons/": "/assets/vendor/three/addons/"
    }
  }
  </script>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
