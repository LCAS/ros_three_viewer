<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROS2 Web Viewer · Modular Demo</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  {
    "imports": {
      "three":          "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/":  "https://unpkg.com/three@0.161.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app-layout">
    <div id="left-pane">
      <div id="viewer-square">
        <canvas
          class="ros-viewer-canvas"
          data-ros-widget="3d"
          data-display="urdf"
          data-urdf-link-whitelist="shoulder_link elbow_link wrist_1_link"
          data-camera-position="2.0 1.6 2.0"
          data-camera-look-at="0 0.5 0"
          data-controls-target="0 0.4 0"
          data-controls-enable-damping="true"
          data-controls-damping-factor="0.06"
          data-controls-min-distance="0.1"
          data-controls-max-distance="20"
          data-controls-auto-rotate="true"
          data-controls-auto-rotate-speed="0.75"></canvas>
      </div>
    </div>

    <div id="right-pane">
      <div style="position: relative; width: 100%; min-height: 240px; border: 1px solid rgba(224, 220, 169, 0.20); border-radius: 4px; overflow: hidden; background: rgba(0, 0, 0, 0.15);">
        <canvas
          class="ros-viewer-canvas"
          data-ros-widget="3d"
          data-display="pointcloud markers"
          data-pointcloud-topics="/integrated_cloud /points"
          data-marker-topics="/markers"
          data-camera-position="2.0 1.6 2.0"
          data-camera-look-at="0 0.5 0"
          data-controls-target="0 0.4 0"
          data-controls-enable-damping="true"
          data-controls-damping-factor="0.06"
          data-controls-min-distance="0.1"
          data-controls-max-distance="20"
          data-controls-auto-rotate="true"
          data-controls-auto-rotate-speed="2"></canvas>
      </div>

      <div id="html-panel" data-ros-widget="html-panel" data-topic="/viewer_panel_html">
        <div id="html-panel-header">
          <span>&#x25CF;&nbsp;OPERATIONS PANEL</span>
          <span data-role="html-topic-label">—</span>
        </div>
        <div id="html-panel-content" data-role="html-content">Waiting for ROS HTML content…</div>
      </div>
    </div>
  </div>

  <div id="bg-wallpaper"></div>
  <div id="vignette"></div>
  <div id="topbar">
    <div id="logo">ROS<span>2</span> Viewer</div>
    <div id="tagline">Modular widgets demo</div>
    <div id="topbar-spacer"></div>
    <div id="ws-pill">
      <div id="ws-dot"></div>
      <span id="ws-label">OFFLINE</span>
    </div>
  </div>

  <div id="status-panel" style="position: fixed; right: 16px; bottom: 16px; z-index: 30; width: 280px;">
    <div id="status-header">System Status</div>
    <div class="status-row"><span class="status-label">ROBOT</span><span class="status-value warn" id="st-robot">waiting…</span></div>
    <div class="status-row"><span class="status-label">JOINTS</span><span class="status-value" id="st-joints">—</span></div>
    <div class="status-row"><span class="status-label">CLOUD</span><span class="status-value" id="st-cloud">—</span></div>
    <div class="status-row"><span class="status-label">MARKERS</span><span class="status-value" id="st-markers">—</span></div>
    <div class="status-row"><span class="status-label">IMAGE</span><span class="status-value" id="st-image">—</span></div>
    <div class="status-row"><span class="status-label">HTML</span><span class="status-value" id="st-html">—</span></div>
    <div class="status-row"><span class="status-label">FPS</span><span class="status-value" id="st-fps">—</span></div>
  </div>

  <div id="image-panel" class="hidden" data-ros-widget="image-panel" data-topic="/camera/color/image_raw" style="display:none;">
    <div id="image-header"><span>SENSOR FEED</span><span id="image-topic-label" data-role="image-topic-label">—</span></div>
    <img id="camera-image" alt="camera feed" style="display:none" />
    <div id="image-placeholder" data-role="image-placeholder">NO SIGNAL</div>
  </div>

  <div id="loading" style="display:none;"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
