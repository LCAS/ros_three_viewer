<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhenAIx · Robo…Crops</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  {
    "imports": {
      "three":         "/assets/vendor/three/three.module.js",
      "three/addons/": "/assets/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div id="app-layout">
    <div id="app-grid">

      <!-- Row 1, Col 1: Robot 3-D viewer (URDF + live depth) -->
      <div class="grid-cell widget-3d">
        <div class="widget-header">
          <span>&#x25CF;&nbsp;ROBOT</span>
        </div>
        <canvas
          class="ros-viewer-canvas"
          data-ros-widget="3d"
          data-display="urdf pointcloud"
          data-urdf-link-whitelist="ground_plane base_link_inertia shoulder_link upper_arm_link forearm_link wrist_1_link wrist_2_link wrist_3_link micasense_body_link micasense_frame_5_link micasense_frame_4_link micasense_frame_1_link micasense_frame_3_link micasense_frame_2_link camera_link"
          data-pointcloud-topics="/capture/depth/points"
          data-camera-position="2.0 1.6 2.0"
          data-camera-look-at="0 0.5 0"
          data-controls-target="0 0.4 0"
          data-fps-throttle="2"
          data-controls-enable-damping="true"
          data-controls-damping-factor="0.06"
          data-controls-min-distance="0.1"
          data-controls-max-distance="20"
          data-controls-auto-rotate="true"
          data-controls-auto-rotate-speed="0.75"></canvas>
      </div>

      <!-- Row 1, Col 2: Integrated point cloud 3-D viewer -->
      <div class="grid-cell widget-3d">
        <div class="widget-header">
          <span>&#x25CF;&nbsp;INTEGRATED CLOUD</span>
        </div>
        <canvas
          class="ros-viewer-canvas"
          data-ros-widget="3d"
          data-display="pointcloud"
          data-pointcloud-topics="/integrated_cloud"
          data-camera-position="1.5 1.2 1.5"
          data-camera-look-at="0 0.3 0"
          data-controls-target="0 0.3 0"
          data-fps-throttle="2"
          data-controls-enable-damping="true"
          data-controls-damping-factor="0.06"
          data-controls-min-distance="0.1"
          data-controls-max-distance="20"
          data-controls-auto-rotate="true"
          data-controls-auto-rotate-speed="1.5"></canvas>
      </div>

      <!-- Row 1, Col 3: Plant traits HTML panel -->
      <div class="grid-cell widget-html" data-ros-widget="html-panel" data-topic="/html">
        <div class="widget-header">
          <span>&#x25CF;&nbsp;PLANT TRAITS</span>
          <span data-role="html-topic-label">—</span>
        </div>
        <div data-role="html-content" class="html-content-inner">Waiting for plant trait data…</div>
      </div>

      <!-- Row 2, Col 1: Live colour image -->
      <div class="grid-cell widget-image" data-ros-widget="image-panel" data-topic="/capture/color/image_raw">
        <div class="widget-header">
          <span>&#x25CF;&nbsp;COLOR FEED</span>
          <span data-role="image-topic-label">—</span>
        </div>
        <img alt="color feed" />
        <div data-role="image-placeholder">NO SIGNAL</div>
      </div>

      <!-- Row 2, Col 2: NIR image -->
      <div class="grid-cell widget-image" data-ros-widget="image-panel" data-topic="/micasense/images/nir">
        <div class="widget-header">
          <span>&#x25CF;&nbsp;NIR</span>
          <span data-role="image-topic-label">—</span>
        </div>
        <img alt="nir feed" />
        <div data-role="image-placeholder">NO SIGNAL</div>
      </div>

      <!-- Row 2, Col 3: NDVI image -->
      <div class="grid-cell widget-image" data-ros-widget="image-panel" data-topic="/traits/ndvi_image">
        <div class="widget-header">
          <span>&#x25CF;&nbsp;NDVI</span>
          <span data-role="image-topic-label">—</span>
        </div>
        <img alt="ndvi feed" />
        <div data-role="image-placeholder">NO SIGNAL</div>
      </div>

    </div><!-- /#app-grid -->
  </div><!-- /#app-layout -->

  <div id="bg-wallpaper"></div>
  <div id="vignette"></div>
  <div id="topbar">
    <div id="logo">PhenAIx</div>
    <div id="tagline">Robo…Crops</div>
    <div id="topbar-spacer"></div>
    <div id="ws-pill">
      <div id="ws-dot"></div>
      <span id="ws-label">OFFLINE</span>
    </div>
  </div>

  <div id="loading" style="display:none;"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
