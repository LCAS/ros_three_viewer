/**:
  ros__parameters:
    # ────────────────────────────────────────────────────────────────────────────
    # Web server
    # ────────────────────────────────────────────────────────────────────────────
    host: "0.0.0.0"               # Bind address for the HTTP/WebSocket server
    port: 8080                      # Port for the HTTP/WebSocket server

    # ────────────────────────────────────────────────────────────────────────────
    # URDF & TF configuration
    # ────────────────────────────────────────────────────────────────────────────
    fixed_frame: "base_link"        # TF frame used as world origin (RViz-style)
    target_frame: "base_link"       # Fallback TF frame (used if fixed_frame not set)

    html_routes: "{'/': 'index.html', '/phenaix_ui': 'phenaix/ui.html', '/modular': 'examples/modular.html'}"  # Route->html path mapping (relative to web/, absolute, or use @package_name@ substitution)
    

    # ────────────────────────────────────────────────────────────────────────────
    # URDF link display filtering is controlled per-canvas via HTML attributes:
    #   data-urdf-link-whitelist="link1 link2 ..."  (space-separated, only show these)
    #   data-urdf-link-blacklist="link1 link2 ..."  (space-separated, hide these)
    #   - "base"
    #   - "flange"
    #   - "tool0"

    # ────────────────────────────────────────────────────────────────────────────
    # Performance & rendering
    # ────────────────────────────────────────────────────────────────────────────
    joint_states_broadcast_hz: 0.1  # Joint state websocket broadcast rate (<=0 disables throttling)
    tf_broadcast_hz: 0.1            # Dynamic TF websocket broadcast rate (<=0 disables throttling)
    image_broadcast_hz: 1.0         # Default image topic websocket broadcast rate (<=0 disables throttling)
    pointcloud_broadcast_hz: 1.0    # Default point cloud topic websocket broadcast rate (<=0 disables throttling)
    image_topic_broadcast_hz: "{}"       # Optional per-topic image rates as JSON/Python dict, e.g. {'/cam/front': 2.0}
    pointcloud_topic_broadcast_hz: "{}"  # Optional per-topic point cloud rates as JSON/Python dict, e.g. {'/points': 0.5}
    pointcloud_max_points: 8000     # Maximum points per cloud (heavier clouds are downsampled)
    image_jpeg_quality: 65          # JPEG quality for compressed image bridge (1-100; lower = faster but blurrier)
